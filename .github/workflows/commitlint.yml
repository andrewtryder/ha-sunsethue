name: Commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              npm run commitlint -- --from "$(git rev-parse HEAD^2)" --to "$(git rev-parse HEAD^1)" --verbose
            else
              npm run commitlint -- --from "$(git rev-parse HEAD^)" --to HEAD --verbose
            fi
          else
            npm run commitlint -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          fi
