name: HACS distribution

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution:
    name: HACS distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py
      - name: Verify HACS source distribution
        run: python scripts/verify_hacs_distribution.py
