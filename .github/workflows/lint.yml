name: Lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv venv --python 3.14
      - run: uv pip install --python .venv/bin/python homeassistant==2026.3.4 pytest-homeassistant-custom-component ruff mypy pre-commit
      - run: uv run --python .venv/bin/python ruff check .
      - run: uv run --python .venv/bin/python ruff format --check .
      - run: uv run --python .venv/bin/python mypy custom_components/sunsethue
      - run: uv run --python .venv/bin/python pre-commit run --all-files
