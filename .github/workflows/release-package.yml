name: Release package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify version consistency
        run: python scripts/verify_release_metadata.py
      - name: Build and inspect integration archive
        run: |
          mkdir -p dist
          (cd custom_components && zip -r ../dist/sunsethue.zip sunsethue -x '*/__pycache__/*' '*.pyc' '*.pyo')
          sha256sum dist/sunsethue.zip > dist/sunsethue.zip.sha256
          unzip -Z1 dist/sunsethue.zip | grep -E '^sunsethue/' >/dev/null
          test -z "$(unzip -Z1 dist/sunsethue.zip | grep -v '^sunsethue/')"
          test -z "$(unzip -Z1 dist/sunsethue.zip | grep -E '(__pycache__/|\.py[co]$)')"
          test "$(unzip -p dist/sunsethue.zip sunsethue/manifest.json | jq -r .version)" = "$(jq -r .version custom_components/sunsethue/manifest.json)"
          sha256sum --check dist/sunsethue.zip.sha256
