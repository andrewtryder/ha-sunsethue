name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv venv --python 3.14
      - run: uv pip install --python .venv/bin/python homeassistant pytest-homeassistant-custom-component pytest-cov
      - run: .venv/bin/pytest
      - name: Verify released version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version custom_components/sunsethue/manifest.json)" = "$version"
          test "$(awk -F '"' '/^VERSION = / {print $2}' custom_components/sunsethue/const.py)" = "$version"
      - name: Package integration only
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/sunsethue.zip sunsethue
          cd ..
          sha256sum dist/sunsethue.zip > dist/sunsethue.zip.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/sunsethue.zip dist/sunsethue.zip.sha256 --clobber
