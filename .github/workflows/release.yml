name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv pip install --system homeassistant pytest-homeassistant-custom-component pytest-cov
      - run: pytest
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify semantic version and manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version custom_components/sunsethue/manifest.json)" = "$tag"
      - name: Package integration only
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/sunsethue.zip sunsethue
          cd ..
          sha256sum dist/sunsethue.zip > dist/sunsethue.zip.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/sunsethue.zip
            dist/sunsethue.zip.sha256
