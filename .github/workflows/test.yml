name: Test
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.3.4", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --group dev --locked
      - name: Install current Home Assistant
        if: matrix.homeassistant == 'latest'
        run: >-
          uv pip install --python .venv/bin/python --upgrade homeassistant
          pytest-homeassistant-custom-component pytest-cov
      - name: Run tests with branch coverage
        run: .venv/bin/python -m pytest
      - name: Add coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo '```text'
            .venv/bin/python -m coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.homeassistant }}
          path: |
            coverage.xml
            coverage.json
