name: Test
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.3.4", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --group dev --locked
      - name: Install current Home Assistant
        if: matrix.homeassistant == 'latest'
        run: >-
          uv pip install --python .venv/bin/python --upgrade homeassistant
          pytest-homeassistant-custom-component pytest-cov
      - name: Run tests with branch coverage
        run: .venv/bin/python -m pytest
      - name: Enforce statement coverage
        run: |
          .venv/bin/python -c 'import json; t = json.load(open("coverage.json"))["totals"]; n = t["num_statements"]; c = t["covered_lines"]; print(f"Statement coverage: {c}/{n}"); assert n and c * 100 >= n * 90, "Statement coverage must be at least 90%"'
      - name: Add coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo '```text'
            .venv/bin/python -m coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.homeassistant }}
          path: |
            coverage.xml
            coverage.json
