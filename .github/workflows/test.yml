name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.3.4", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --group dev --locked
      - name: Install current Home Assistant
        if: matrix.homeassistant == 'latest'
        run: >-
          uv pip install --python .venv/bin/python --upgrade homeassistant
          pytest-homeassistant-custom-component pytest-cov
      - run: .venv/bin/pytest
