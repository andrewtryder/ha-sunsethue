name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: Test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.3.4", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv venv --python 3.14
      - name: Install minimum Home Assistant
        if: matrix.homeassistant != 'latest'
        run: uv pip install --python .venv/bin/python "homeassistant==${{ matrix.homeassistant }}" pytest-homeassistant-custom-component pytest-cov
      - name: Install current Home Assistant
        if: matrix.homeassistant == 'latest'
        run: uv pip install --python .venv/bin/python homeassistant pytest-homeassistant-custom-component pytest-cov
      - run: .venv/bin/pytest
