[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-sunsethue"
version = "0.2.2"
description = "HACS custom integration for SunsetHue forecasts"
requires-python = ">=3.14.2"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "homeassistant==2026.3.4",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pytest==9.0.0",
    "pytest-cov==7.0.0",
    "pytest-homeassistant-custom-component==0.13.320",
    "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["custom_components/sunsethue/brand"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=custom_components.sunsethue --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["custom_components/sunsethue"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*"]
follow_untyped_imports = true
